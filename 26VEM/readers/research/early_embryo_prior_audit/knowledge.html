<script>
const DATA=JSON.parse(document.getElementById('audit-data').textContent),R=DATA.records,COPY=DATA.reading;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>(x*100).toFixed(2)+'%',num=x=>Number(x).toLocaleString('en-US');
const labels={author_observed:'论文中的观察',author_inferred:'论文中的模型推测',recomputed_external:'本次从外部图谱算出的结果'};
const statusNames={'观测一致':'变化方向一致','观测相反':'变化方向相反','结果混合':'样本之间不一致','条件不可比':'暂时不能直接比较','面板未覆盖':'官方未提供所需基因','证据不足':'目前证据不够'};
const preferred=['D008','D010','D011','D007','D009','D012'];
const order=new Map([...preferred,...R.map(c=>c.id).filter(id=>!preferred.includes(id))].map((id,i)=>[id,i]));
let selected=new URLSearchParams(location.search).get('claim')||new URLSearchParams(location.hash.slice(1)).get('claim')||'D008';
$('summary').innerHTML='<b>34条记录</b><span>22条来自论文原文</span><span>12条来自外部图谱计算</span><span>2条变化方向一致，其余逐条说明原因</span>';
function options(id,values,label=v=>v){values.forEach(v=>$(id).insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(label(v))}</option>`))}
options('stage',[...new Set(R.flatMap(c=>c.stages))].sort(),v=>v.startsWith('Et')?'作者估计时间 '+v:v);
options('celltype',[...new Set(R.map(c=>c.cell_type))],v=>COPY[R.find(c=>c.cell_type===v).id].cell_name);
options('gene',[...new Set(R.flatMap(c=>c.genes))].sort());options('status',[...new Set(R.map(c=>c.evaluation.status))],v=>statusNames[v]);
options('source',[...new Set(R.map(c=>c.source_id))],v=>COPY[R.find(c=>c.source_id===v).id].source_name);
options('type',[...new Set(R.map(c=>c.evidence_type))],v=>labels[v]);
function filtered(){const q=$('query').value.trim().toLowerCase();return R.filter(c=>{const d=COPY[c.id];return (!q||[c.id,d.title,d.cell_name,d.source_name,d.source_text,d.official_text,c.cell_type,...c.genes].join(' ').toLowerCase().includes(q))&&(!$('stage').value||c.stages.includes($('stage').value))&&(!$('celltype').value||c.cell_type===$('celltype').value)&&(!$('gene').value||c.genes.includes($('gene').value))&&(!$('status').value||c.evaluation.status===$('status').value)&&(!$('source').value||c.source_id===$('source').value)&&(!$('type').value||c.evidence_type===$('type').value)}).sort((a,b)=>order.get(a.id)-order.get(b.id))}
function badge(c){return `<span class="badge ${c.evaluation.status==='观测一致'?'good':''}">${esc(COPY[c.id].status_text)}</span>`}
function showList(){const rows=filtered();if(!rows.some(c=>c.id===selected))selected=rows[0]?.id;$('match-count').textContent=`显示 ${rows.length} 条`;$('list').innerHTML=rows.length?rows.map(c=>{const d=COPY[c.id];return `<button class="item ${c.id===selected?'selected':''}" data-id="${esc(c.id)}"><span class="item-id">${esc(c.id)}</span>${badge(c)}<div class="item-title">${esc(d.title)}</div><div class="item-note">${esc(d.list_note)}</div><div class="source-title">${esc(d.source_short)}</div></button>`}).join(''):'<p class="empty">没有符合条件的记录。</p>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{selected=b.dataset.id;history.replaceState(null,'','#claim='+selected);showList()});showDetail()}
function pairs(o){return Object.entries(o).map(([key,value])=>`<div class="label">${esc(key)}</div><div>${value}</div>`).join('')}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function compositionTable(c,d){return table(['阶段','外部图谱：样本平均占比','外部样本数','官方：同名细胞占比'],d.source_stats.map(s=>{const o=c.evaluation.observations.find(o=>o.stage===s.stage);return [esc(s.stage),pct(s.mean),s.samples,o.absent_label_not_biological_absence?'没有同名标签':pct(o.proportion)]}))}
function sourceSampleTable(d){return table(['阶段','外部样本','该类细胞数','该样本总细胞数','占比'],d.source_stats.flatMap(s=>s.sample_rows).map(r=>[esc(r.stage),esc(r.sample.replace('EMTAB_pool_','样本 ')),num(r.n)+(r.n<30?' <span class="small">（少于30）</span>':''),num(r.denominator),pct(r.proportion)]))}
function officialCounts(c){return table(['阶段','文件中的原标签','该类细胞数','文件总细胞数','占比'],c.evaluation.observations.map(o=>[esc(o.stage),esc(o.label),num(o.n),num(o.denominator),o.absent_label_not_biological_absence?'没有同名标签':pct(o.proportion)]))}
function markerTable(c,technical=false){const obs=c.evaluation.observations;if(!obs.length)return '<p>这条记录没有能够直接核对的官方表达数据，原因见上。</p>';const columns=technical?['阶段','原标签','基因','细胞数','归一化表达均值','与其余细胞的均值差','区分能力（AUC）']:['阶段','文件中的原标签','基因','该类细胞数','检出比例'];return table(columns,obs.map(o=>[esc(o.stage),esc(o.label),esc(o.gene),num(o.n)+(o.n<30?' <span class="small">（少于30）</span>':''),...(technical?[o.mean_log.toFixed(3),o.mean_difference?.toFixed(3)??'—',o.auc?.toFixed(3)??'—']:[pct(o.detected_fraction)])]))}
function showDetail(){const c=R.find(c=>c.id===selected);if(!c){$('detail').innerHTML='';return}const d=COPY[c.id],s=c.source_record,derived=c.id.startsWith('D');
